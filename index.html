<style>

#mic.on{background:var(--mark);color:var(--markink);border-color:var(--mark)}
#cnt{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;margin-right:8px;border-radius:6px;background:var(--mark);color:var(--markink);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;vertical-align:middle}
#ptab{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);width:90px;height:26px;border:none;border-radius:0 0 14px 14px;background:var(--mark);color:var(--markink);opacity:.45;font-size:16px;padding:0;z-index:20}
@media (orientation:portrait){body.hp h1,body.hp .hint,body.hp .bar{display:none}body.hp #ptab{display:block}body.hp .c{font-size:clamp(10px,3.6vw,18px)}
body{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column}
#plates{flex:1;min-height:max(300px,50vh);grid-template-rows:repeat(var(--r,3),minmax(0,1fr))}
.plate{display:flex;flex-direction:column;min-height:0}

.grid{align-content:start}}

:root[data-theme="blue"]{--bg:#0b1626;--card:#14253d;--ink:#eaf2ff;--dim:#8fa3bf;--line:#2b4468;--mark:#4dabf7;--markink:#08233f;--empty:#0f1d31;--ok:#69db7c}
:root[data-theme="green"]{--bg:#0f1f17;--card:#17301f;--ink:#eaf7ee;--dim:#8fb59a;--line:#2c5a3d;--mark:#ffd43b;--markink:#2b2200;--empty:#12261a;--ok:#8ce99a}
:root[data-theme="contrast"]{--bg:#000;--card:#000;--ink:#fff;--dim:#ccc;--line:#fff;--mark:#ffe600;--markink:#000;--empty:#1a1a1a;--ok:#00ff6a}
@media (orientation:landscape){
#lay{display:inline-block}
body.hb{grid-template-columns:0 1fr;column-gap:0}

body{padding:4px max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left))}
#clk{grid-column:1;grid-row:1;justify-self:start;font-size:15px;line-height:34px}
#dte{grid-column:3;grid-row:1;justify-self:end;font-size:15px;line-height:34px}
h1,.hint{display:none}
body{display:grid;grid-template-columns:max-content 1fr;grid-template-rows:auto auto auto 1fr;column-gap:6px;align-items:start}
.bar{grid-column:1;grid-row:1/-1;flex-direction:column;flex-wrap:nowrap;margin:0;gap:5px;height:calc(100vh - 8px);height:calc(100dvh - 8px);overflow-y:auto}
.bar #reset{flex-basis:auto;margin-top:auto;padding:22px 10px;font-size:16px;text-align:center}
.bar button.t{width:100%;text-align:left}
#check{grid-column:2;grid-row:1}
#plates{grid-column:2;grid-row:3}
#topline{grid-column:2;grid-row:2;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:3px}
#brand{grid-column:2;grid-row:1;margin:0;font-size:20px;line-height:34px;height:34px;white-space:nowrap;display:flex;align-items:center;justify-content:center}
#brand #cnt{height:24px;min-width:24px;font-size:13px;margin-right:6px}
button.t{padding:6px 10px;font-size:13px;white-space:nowrap}
#plates{gap:6px}
body.l32 #plates{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,auto);grid-auto-flow:row}
.plate{padding:3px}
.ph{margin-bottom:2px;font-size:11px}
.c{box-sizing:border-box;aspect-ratio:auto;height:calc((100vh - 186px)/9);height:calc((100dvh - 186px)/9);font-size:clamp(10px,min(2.4vw,3.8vh),20px)}
body.l32 .c{height:calc((100vh - 141px)/6);height:calc((100dvh - 141px)/6);font-size:clamp(11px,min(2.2vw,4.2vh),20px)}
.rows{margin-top:2px;font-size:11px}
.rows span{padding:1px 0}
body{height:100vh;height:100dvh;box-sizing:border-box;grid-template-rows:auto auto 1fr}
#plates{align-self:stretch;min-height:0;grid-template-rows:repeat(var(--r,3),minmax(0,1fr))}
body.l32 #plates{grid-template-rows:repeat(var(--r3,2),minmax(0,1fr))}
.plate{display:flex;flex-direction:column;min-height:0}
.grid{flex:1;min-height:0;grid-template-rows:repeat(3,minmax(0,1fr))}
.c,body.l32 .c{height:auto;min-height:0}
body.hb{padding-left:max(22px,env(safe-area-inset-left))}
body.hb #grip{width:18px;height:70px;font-size:14px}
}
</style>

<body>
<h1>Min banko-plade</h1>
<div class="bar">
  <button class="t" id="edit"></button>
  <button class="t" id="add">+ Plade</button>
  <button class="t" id="chk">Tjek tal</button>
  <button class="t" id="lay"></button>
  <button class="t" id="thm"></button>
  <button class="t" id="lang"></button>
  <button class="t" id="vib"></button>

  <button class="t" id="fs" style="display:none">⛶</button>
  <button class="t" id="reset">Ryd markeringer</button>
</div>
<p class="hint" id="hint"></p>
<div id="check"></div>
<div id="topline"><div id="clk"></div><div id="dte"></div><div id="brand"><span id="cnt">0</span>Club 90’ by ErKaTek<sup>®</sup></div></div>
<div id="plates"></div>
<button id="grip" aria-label="Vis knapper">›</button>
<button id="ptab" aria-label="Vis knapper">▾</button>
<div id="toast"></div>
<script>
var KEY="banko-v3";
var LI=0;
try{var sl0=localStorage.getItem('banko-lang');if(sl0!==null)LI=+sl0||0}catch(e){}
function blank(){return{cells:Array(27).fill(""),marks:Array(27).fill(false)}}
var D=['8 - 21 - - 55 61 75 - | 9 - - 35 43 56 - - 86 | - 17 23 - 46 - 64 - 89','- 11 - 31 44 50 - 70 - | 2 13 26 - - - 67 78 - | - 18 - 37 - 54 - 79 81','1 - - - 41 59 65 - 88 | 3 - 20 30 45 - - 72 - | - 19 25 33 - - 69 - 90','- - 24 32 40 - - 76 83 | 6 - 28 - 42 52 62 - - | 7 15 - 34 - 57 - - 84','4 12 - - - 53 - 71 80 | - 14 - 38 - - 60 73 82 | - 16 22 - 47 - 68 - 85','- 10 27 - 48 51 63 - - | - - 29 36 49 - 66 74 - | 5 - - 39 - 58 - 77 87'];
function mk(s){var t=s.replace(/\|/g,' ').split(/\s+/).filter(Boolean).map(function(x){return x==='-'?'':x});return{cells:t,marks:Array(27).fill(false)}}
var S={plates:D.map(mk),edit:false};
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.plates&&p.plates.length)S=p}}catch(e){}
if(S.plates.length>12)S.plates.length=12;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function t(key){try{return (UI[LI]&&UI[LI][key])||UI[0][key]||key}catch(e){return key}}
function tTheme(k){try{return (UI[LI]&&UI[LI].theme&&UI[LI].theme[k])||UI[0].theme[k]||k}catch(e){return k}}
function render(){
  document.getElementById("edit").textContent=S.edit?t('editDone'):t('edit');
  document.getElementById("edit").className="t"+(S.edit?" on":"");
  document.getElementById("hint").textContent=S.edit?t('hintEdit'):t('hintPlay');
  document.getElementById("add").textContent=t('add');
  document.getElementById("chk").textContent=t('check');
  // Antal forskellige numre der er markeret (råbt op)
  var marked={};
  S.plates.forEach(function(pl){pl.cells.forEach(function(v,i){if(v!==""&&pl.marks[i])marked[v]=1})});
  var cntEl=document.getElementById("cnt");
  if(cntEl)cntEl.textContent=Object.keys(marked).length;
  var box=document.getElementById("plates");box.innerHTML="";document.getElementById('add').disabled=S.plates.length>=12;box.style.setProperty('--r',Math.max(3,Math.ceil(S.plates.length/2)));box.style.setProperty('--r3',Math.max(2,Math.ceil(S.plates.length/3)));
  S.plates.forEach(function(pl,pi){
    var d=document.createElement("div");d.className="plate";
    var h=document.createElement("div");h.className="ph";
    h.innerHTML="<span>"+t('plate')+" "+(pi+1)+"</span>";
    if(S.plates.length>1&&S.edit){var x=document.createElement("button");x.textContent=t('del');x.onclick=function(){if(x.dataset.s){S.plates.splice(pi,1);save();render()}else{x.dataset.s="1";x.textContent=t('delConfirm');setTimeout(function(){x.dataset.s="";x.textContent=t('del')},3000)}};h.appendChild(x)}
    d.appendChild(h);
    var g=document.createElement("div");g.className="grid";
    pl.cells.forEach(function(v,i){
      var el;
      if(S.edit){el=document.createElement("input");el.type="text";el.inputMode="numeric";el.maxLength=2;el.value=v;el.className="c";
        el.oninput=function(){el.value=el.value.replace(/\D/g,"");pl.cells[i]=el.value;save();if(el.value.length===2){var n=el.parentNode.children[i+1];if(n&&n.tagName==="INPUT")n.focus()}}}
      else{el=document.createElement("button");el.className="c"+(v===""?" e":(pl.marks[i]?" m":""));el.textContent=v;
        if(v!=="")el.onclick=function(){
          var wasOn=pl.marks[i];
          // Markér/afmarkér ALLE forekomster af det samme tal på alle plader
          S.plates.forEach(function(p){
            for(var j=0;j<p.cells.length;j++){
              if(p.cells[j]===v) p.marks[j]=!wasOn;
            }
          });
          save();
          if(!wasOn) buzz(pl,i);
          render();
        };else el.disabled=true}
      g.appendChild(el)});
    d.appendChild(g);
    if(!S.edit){var rw=document.createElement("div");rw.className="rows";
      for(var r=0;r<3;r++){var left=0,tot=0;for(var c=0;c<9;c++){var k=r*9+c;if(pl.cells[k]!==""){tot++;if(!pl.marks[k])left++}}
        var s=document.createElement("span");
        if(tot>0&&left===0){s.className="done";s.textContent="✓"}else s.textContent=left;
        rw.appendChild(s)}
      d.appendChild(rw)}
    box.appendChild(d)});
}
document.getElementById("edit").onclick=function(){S.edit=!S.edit;save();render()};
document.getElementById("add").onclick=function(){if(S.plates.length>=12){toast(t('maxPlates'));return}S.plates.push(blank());S.edit=true;save();render()};
var rb=document.getElementById("reset"),rt;
function rbOff(){rb.dataset.s="";rb.textContent=t('reset');rb.classList.remove("on")}
rb.onclick=function(){if(rb.dataset.s){clearTimeout(rt);rbOff();S.plates.forEach(function(p){p.marks=p.marks.map(function(){return false})});save();render()}else{rb.dataset.s="1";rb.textContent=t('resetConfirm');rb.classList.add("on");rt=setTimeout(rbOff,3000)}};
function check(){
 var locs={},iss=[];
 S.plates.forEach(function(pl,pi){
  for(var r=0;r<3;r++){var rc=0;
   for(var c=0;c<9;c++){var v=pl.cells[r*9+c];
    if(v!==''){rc++;var n=parseInt(v,10);
     if(n<1||n>90){iss.push('Plade '+(pi+1)+', række '+(r+1)+': '+v+' er uden for 1-90');continue}
     (locs[n]=locs[n]||[]).push(pi+1);
     var ec=n<10?0:Math.min(8,Math.floor(n/10));
     if(ec!==c)iss.push('Plade '+(pi+1)+', række '+(r+1)+': '+n+' står i kolonne '+(c+1)+' (hører normalt i kolonne '+(ec+1)+')')}}
   if(rc!==5)iss.push('Plade '+(pi+1)+', række '+(r+1)+': '+rc+' tal (skal være 5)')}});
 var miss=[],tot=0,full=S.plates.length===6,np=S.plates.length;
 for(var k=1;k<=90;k++){if(!locs[k])miss.push(k);else{tot++;if(full){if(locs[k].length>1)iss.unshift('Dobbelt: '+k+' står på plade '+locs[k].join(' og '))}else{var cnt={};locs[k].forEach(function(p){cnt[p]=(cnt[p]||0)+1;if(cnt[p]===2)iss.unshift('Dobbelt på plade '+p+': '+k)})}}}
 var okAll=full?(!iss.length&&!miss.length):!iss.length;
 var el=document.getElementById('check');el.innerHTML='';el.className='on';
 function line(t,cl){var p=document.createElement('p');p.textContent=t;if(cl)p.className=cl;el.appendChild(p)}
 if(okAll)line(full?'✓ Alle 90 tal er indtastet præcis én gang, og hver række har 5.':'✓ '+np+' plader: hver række har 5 tal, og der er ingen fejl. Samme tal på flere plader er normalt, når du ikke har 6 plader.','ok');
 else{if(full)line('Fundet '+tot+' af 90 forskellige tal.');iss.forEach(function(t){line('• '+t)});if(full&&miss.length)line('Mangler: '+miss.join(', '))}
 line('✕ Tryk her for at lukke','x');el.onclick=function(){el.className='';clearTimeout(ct)};clearTimeout(ct);if(okAll)ct=setTimeout(function(){el.className=''},5000);
}
var ct;document.getElementById('chk').onclick=check;
var lb=document.getElementById('lay'),L=false;
try{L=localStorage.getItem('banko-lay')==='1'}catch(e){}
function setL(){document.body.classList.toggle('l32',L);lb.textContent=L?t('lay3'):t('lay2')}
lb.onclick=function(){L=!L;try{localStorage.setItem('banko-lay',L?'1':'0')}catch(e){}setL()};
setL();
var TH=['auto','light','dark','blue','green','contrast'],ti=0,tb=document.getElementById('thm');
try{var sv=localStorage.getItem('banko-theme');if(sv&&TH.indexOf(sv)>-1)ti=TH.indexOf(sv)}catch(e){}
function setT(){var th=TH[ti];if(th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th);tb.textContent='🎨 '+tTheme(th)}
tb.onclick=function(){ti=(ti+1)%TH.length;try{localStorage.setItem('banko-theme',TH[ti])}catch(e){}setT()};
setT();
var VIB=true,vb=document.getElementById('vib');
try{VIB=localStorage.getItem('banko-vib')!=='0'}catch(e){}
function vibe(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function buzz(pl,i){if(!VIB)return;var r=Math.floor(i/9),rowDone=true,all=true;for(var k=0;k<27;k++){if(pl.cells[k]!==''&&!pl.marks[k]){all=false;if(Math.floor(k/9)===r)rowDone=false}}if(all)vibe([300,120,300,120,300]);else if(rowDone)vibe(250)}
function setV(){vb.textContent=t('vib');vb.classList.toggle('on',VIB)}
vb.onclick=function(){VIB=!VIB;try{localStorage.setItem('banko-vib',VIB?'1':'0')}catch(e){}setV();if(VIB)vibe(60)};
setV();
var ht,gp=document.getElementById('grip'),barEl=document.querySelector('.bar'),tx=null;
function isLand(){return window.matchMedia('(orientation:landscape)').matches}
function hideBar(){
  // Kun auto-skjul når fuldskærm er aktiv (knappen er gul)
  if(!document.fullscreenElement){document.body.classList.remove('hb','hp');return}
  if(S.edit||rb.dataset.s){sched();return}
  if(isLand())document.body.classList.add('hb');
  else document.body.classList.add('hp');
}
function showBar(){document.body.classList.remove('hb');document.body.classList.remove('hp');sched()}
function sched(){clearTimeout(ht);ht=setTimeout(hideBar,6000)}
gp.onclick=showBar;document.getElementById('ptab').onclick=showBar;
barEl.addEventListener('pointerdown',sched,true);
window.addEventListener('resize',function(){var b=document.body.classList;b.remove('hb');if(!(document.fullscreenElement&&!isLand()&&!S.edit))b.remove('hp');sched()});
document.addEventListener('touchstart',function(e){var t=e.touches[0];tx=t.clientX<70?t.clientX:null},{passive:true});
document.addEventListener('touchmove',function(e){if(tx!==null&&e.touches[0].clientX-tx>45){tx=null;if(document.body.classList.contains('hb'))showBar()}},{passive:true});
sched();
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,LS=false,rec=null,wl=null,mb=document.getElementById('mic'),tt,tel=document.getElementById('toast');
function toast(t){tel.textContent=t;tel.className='on';clearTimeout(tt);tt=setTimeout(function(){tel.className=''},2800)}
var LANGS=[
{c:'da-DK',n:'Dansk',ig:['og','nummer','numre','nr','tal','næste','banko'],cu:'og',sfx:'indstyve',U:['en et','to','tre','fire','fem','seks','syv','otte','ni'],X:['ti','elleve','tolv','tretten','fjorten','femten','seksten','sytten','atten','nitten'],T:['tyve','tredive','fyrre','halvtreds','treds tres','halvfjerds','firs','halvfems']},

function stopListen(m){
  LS=false;clearPendDigit(true);clearTimeout(watchTimer);clearInterval(keepAlive);restarting=false;
  try{if(rec){rec.onend=null;rec.onerror=null;rec.abort()}}catch(e){}
  rec=null;wake(false);setM();if(m)toast(m);
}
function setPhrases(){try{if(typeof SpeechRecognitionPhrase!=='undefined'&&rec&&('phrases' in rec)){var ph=[];Object.keys(LANGS[LI].m).forEach(function(w){ph.push(new SpeechRecognitionPhrase(w,4.0))});rec.phrases=ph}}catch(e){}}
function startListen(){if(!SR){toast(t('noSpeech'));return}
 LS=true;setM();wake(true);toast(t('listening'));restartRec();
 clearInterval(keepAlive);
 keepAlive=setInterval(function(){
   if(!LS)return;
   if(Date.now()-lastHeard>(isIOS?5000:10000))restartRec();
 },isIOS?3000:5000)}
mb.onclick=function(){if(LS){clearPendDigit(true);stopListen(t('listenOff'))}else startListen()};
var gb=document.getElementById('lang');
try{var sl=localStorage.getItem('banko-lang');if(sl!==null&&LANGS[+sl])LI=+sl;else LI=0}catch(e){LI=0}
var fsb=document.getElementById('fs');
function reqFs(){try{var p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function updateFsBtn(){
  if(!fsb)return;
  fsb.textContent=t('fs');
  if(document.fullscreenElement){fsb.classList.add('on')}
  else{fsb.classList.remove('on');document.body.classList.remove('hb','hp')}
}
if(document.fullscreenEnabled && fsb){
  fsb.style.display='';
  fsb.onclick=function(){
    if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}
    else reqFs();
  };
  document.addEventListener('fullscreenchange',function(){
    updateFsBtn();
    if(document.fullscreenElement) sched();
  });
}
function setG(){gb.textContent='🌐 '+LANGS[LI].n}
function refreshUI(){
  setG();setM();setV();setT();setL();
  updateFsBtn();
  rbOff();
  render();
}
gb.onclick=function(){LI=(LI+1)%LANGS.length;try{localStorage.setItem('banko-lang',LI)}catch(e){}refreshUI();toast('🌐 '+LANGS[LI].n);if(rec){rec.lang=LANGS[LI].c;setPhrases();if(LS){try{rec.abort()}catch(e){}}}};
refreshUI();
var ce=document.getElementById('clk'),de=document.getElementById('dte');
function tick(){var n=new Date();function z(x){return x<10?'0'+x:''+x}ce.textContent=z(n.getHours())+':'+z(n.getMinutes())+':'+z(n.getSeconds());de.textContent=n.toLocaleDateString('da-DK',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
tick();setInterval(tick,1000);
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
